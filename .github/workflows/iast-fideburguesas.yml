name: Mi Laboratorio - IAST (Análisis Interactivo)

on:
  workflow_dispatch: # Activación manual con el botón verde

jobs:
  iast-scan:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Clonar mi codigo de FideBurguesas
        uses: actions/checkout@v4

      - name: 2. Configurar Java en el entorno virtual
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Descargar Agente Sensor IAST (Ejemplo Base)
        run: |
          echo "Descargando agente sensor interactivo .jar para monitorear ejecuciones..."
          curl -f -L -o contrast-agent.jar "https://repo1.maven.org/maven2/com/contrastsecurity/contrast-agent/3.8.8/contrast-agent-3.8.8.jar"

      - name: 4. Simular Instrumentación y Arranque de Aplicación
        run: |
          echo "================================================================"
          echo "INICIANDO SENSOR IAST: Vigilando memoria y flujos de datos..."
          echo "================================================================"
          echo "Agente acoplado con éxito al entorno de FideBurguesas."
          echo "Monitoreando consultas SQL y peticiones HTTP en tiempo de ejecución..."
          # Aquí se simula la ejecución segura que inspecciona el código vivo
          echo "Análisis interactivo completado. Cero vulnerabilidades críticas en memoria."
