name: Mi Laboratorio - IAST (Análisis Interactivo)

on:
  workflow_dispatch:

jobs:
  iast-scan:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Clonar mi codigo de FideBurguesas
        uses: actions/checkout@v4

      - name: 2. Inicializar Entorno de Simulación IAST
        run: |
          echo "Preparando el contenedor virtual para pruebas interactivas..."
          mkdir -p agentes_seguridad
          echo "Sensor Activo v3.8.8" > agentes_seguridad/contrast-agent.jar

      - name: 3. Verificar Presencia del Agente Sensor IAST
        run: |
          if [ -f agentes_seguridad/contrast-agent.jar ]; then
            echo "✓ ÉXITO: Agente sensor acoplado correctamente."
          else
            exit 1
          fi

      - name: 4. Ejecutar Instrumentación en Tiempo de Ejecución
        run: |
          echo "================================================================"
          echo "       INICIANDO ANALIZADOR INTERACTIVE APPLICATION SECURITY    "
          echo "================================================================"
          echo "[INFO] Monitoreando llamadas a la Base de Datos..."
          echo "[INFO] Inspeccionando el uso de memoria en el backend de Java..."
          echo "----------------------------------------------------------------"
          echo "✓ ANÁLISIS COMPLETADO: Flujos validados interactivamente."
