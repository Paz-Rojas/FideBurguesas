name: Laboratorio- Análisis Interactivo (IAST)

on:
  push:
    branches: [ "develop" ]

jobs:
  iast-instrumentation:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      # Configuración del entorno de ejecución (Ejemplo basado en un backend de Java, se puede ajustar al lenguaje de VADI)
      - name: Configurar Entorno de Ejecución
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Descargar Agente Sensor IAST
        run: |
          curl -f -L -o contrast-agent.jar "https://repo1.maven.org/maven2/com/contrastsecurity/contrast-agent/3.8.8/contrast-agent-3.8.8.jar"

      - name: Levantar Servidor de Pruebas Instrumentado
        env:
          CONTRAST__API__API_KEY: ${{ secrets.VADI_IAST_KEY }}
          CONTRAST__API__ORGANIZATION_ID: ${{ secrets.VADI_IAST_ORG }}
          CONTRAST__API__URL: "https://ce.contrastsecurity.com"
        run: |
          # Se arranca la aplicación activando el agente interactivo (.jar) adjunto en segundo plano
          java -javaagent:contrast-agent.jar -Dcontrast.env=QA -jar app-vadi-test.jar &
          sleep 20
          
          # Lanzar los comandos de pruebas automáticas rutinarias (Selenium, Postman, etc.) de la empresa
          # El agente monitorizará el flujo de datos real en memoria buscando brechas complejas.
          npm run test:integration
