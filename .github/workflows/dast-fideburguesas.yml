name: Laboratorio - Seguridad Dinámica (DAST)

on:
  workflow_dispatch: # Se ejecuta manualmente a demanda del equipo de seguridad

jobs:
  dast-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Ejecutar Ataque Simulado (OWASP ZAP)
        uses: zaproxy/action-baseline@v0.13.0
        with:
          # IMPORTANTE: Cambia esta URL por la del entorno interno de pruebas o QA de VADI. 
          # NUNCA uses la URL de producción comercial de la empresa para evitar caídas del servicio.
          target: 'https://qa-pruebas.vadi-interno.com'
          fail_action: true # Notifica fallos en rojo si la web activa es vulnerable
