name: VADI - Seguridad SAST (Semgrep)

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  sast-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio de VADI
        uses: actions/checkout@v4

      - name: Instalar Semgrep
        run: pip install semgrep

      - name: Ejecutar Análisis Preventivo Estricto
        # El parámetro '--error' hace que si se detecta un fallo crítico, el pipeline falle (rojo) 
        # bloqueando el flujo de trabajo para obligar a corregir el código.
        run: semgrep --config "p/owasp-top-ten" --error --json --output=reporte-sast-vadi.json .

      - name: Archivar Reporte de Código Fuente
        uses: actions/upload-artifact@v4
        with:
          name: reporte-sast-vadi
          path: reporte-sast-vadi.json
